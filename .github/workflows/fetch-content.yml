name: Fetch K-Pop Content

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios rss-parser

      - name: Fetch all content
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-content.js

      - name: Commit updated data
        run: |
          git config user.name "kpop-bot"
          git config user.email "bot@kpop-network.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update content $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
